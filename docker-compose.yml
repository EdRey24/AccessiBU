# AccessiBU — one command to run the web app and the API locally.
#
#   docker compose up
#
# Then open:
#   Web app  -> http://localhost:8081
#   Backend  -> http://localhost:8000  (docs at /docs)
#
# Postgres and Auth live in the shared hosted Supabase project. Copy
# backend/.env.example to backend/.env and fill it in before starting.
# The web service reads EXPO_PUBLIC_MAPBOX_TOKEN from your .env file.

services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file:
      - .env
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "8081:8081"
    depends_on:
      - backend
