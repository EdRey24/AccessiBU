# AccessiBU — one command to run the whole stack locally.
#
#   docker compose up
#
# Then open:
#   Web app  -> http://localhost:8081
#   Backend  -> http://localhost:8000  (docs at /docs)
#
# The web service reads EXPO_PUBLIC_MAPBOX_TOKEN from your .env file (copy
# .env.example to .env and fill it in first — the map needs it).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: accessibu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d accessibu"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@db:5432/accessibu
      JWT_SECRET: dev-secret-change-me
      STORAGE_BUCKET: hazard-images
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file:
      - .env
    environment:
      # Default the classifier at the local backend if not set in .env.
      EXPO_PUBLIC_CLASSIFIER_URL: ${EXPO_PUBLIC_CLASSIFIER_URL:-http://localhost:8000/classify}
    ports:
      - "8081:8081"
    depends_on:
      - backend

volumes:
  pgdata:
